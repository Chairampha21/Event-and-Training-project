<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CPSU ETMS · Use Case Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:'Noto Sans Thai',Loma,sans-serif;color:#111}
  #canvas{position:relative;width:1720px;height:1450px;background:#fff;overflow:hidden}
  .wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .wire-label{font:500 15px 'Noto Sans Thai',sans-serif}
  .boundary{position:absolute;left:230px;top:14px;width:1300px;height:1422px;border:2px solid #111}
  .boundary h2{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:31px;font-weight:700}
  .uc{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.6px solid #111;border-radius:50%;
      background:#fff;font-size:19.5px;font-weight:600;line-height:1.35;padding:0 14px;color:#000}
  .actor{position:absolute;width:190px;text-align:center}
  .actor svg{display:block;margin:0 auto}
  .actor b{display:block;font-size:22px;margin-top:6px;font-weight:700;line-height:1.3}
</style>
</head>
<body>
<div id="canvas">
  <div class="boundary"><h2>ระบบจัดการกิจกรรมและอบรมแบบครบวงจร</h2></div>
</div>
<script src="connect.js"></script>
<script>
  const C = document.getElementById('canvas');
  const STICK = `<svg width="64" height="110" viewBox="0 0 64 110" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round">
    <circle cx="32" cy="15" r="13" fill="#fff"/><path d="M32 28v44M8 46h48M32 72 12 106M32 72l20 34"/></svg>`;
  function actor(id, x, y, name) {
    C.insertAdjacentHTML('beforeend', `<div class="actor" id="${id}" style="left:${x}px;top:${y}px"><div class="fig">${STICK}</div><b>${name}</b></div>`);
  }
  // centre x, centre y, text, width, height
  function uc(id, cx, cy, text, w = 285, h = 70) {
    C.insertAdjacentHTML('beforeend', `<div class="uc" id="${id}" style="left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px">${text}</div>`);
  }

  actor('A-org', 20, 250, 'ผู้จัดกิจกรรม');
  actor('A-stu', 20, 830, 'นักศึกษา/ผู้เข้าร่วมกิจกรรม');
  actor('A-tea', 20, 1230, 'อาจารย์');
  actor('A-adm', 1530, 560, 'ผู้ดูแลระบบ');

  const ORG = ['สร้างกิจกรรม', 'จัดการกิจกรรม', 'ตรวจสอบรายชื่อผู้สมัคร', 'เช็คชื่อผู้เข้าร่วมกิจกรรม', 'ออกเกียรติบัตร', 'ดูรายงานสรุปกิจกรรม'];
  ORG.forEach((t, i) => uc('o' + i, 470, 112 + i * 84, t));
  uc('o-detail', 1010, 168, 'กำหนดรายละเอียดกิจกรรม', 320);
  uc('o-open', 1010, 286, 'เปิด/ปิดรับสมัคร', 300);

  uc('login', 900, 640, 'เข้าสู่ระบบด้วยอีเมล<br>@silpakorn.edu', 350, 116);

  const STU = ['ดูรายการกิจกรรม', 'ลงทะเบียนเข้าร่วมกิจกรรม', 'ตรวจสอบสถานะการสมัคร', 'รับการแจ้งเตือน', 'ดาวน์โหลดเกียรติบัตร'];
  STU.forEach((t, i) => uc('s' + i, 470, 756 + i * 88, t));
  // A teacher takes part like any participant, and follows the events they coordinate.
  const TEA = ['ดูกิจกรรมที่รับผิดชอบ', 'ดูรายงานกิจกรรม'];
  TEA.forEach((t, i) => uc('t' + i, 470, 1260 + i * 100, t));
  uc('t-result', 1010, 1360, 'ดูผลประเมินและงบประมาณ', 320);
  uc('s-detail', 1010, 844, 'ดูรายละเอียดกิจกรรม', 300);
  uc('s-history', 1010, 1108, 'ดูประวัติการเข้าร่วมกิจกรรม', 330);

  const ADM = ['จัดการข้อมูลผู้ใช้งาน', 'กำหนดสิทธิ์การใช้งาน', 'จัดการข้อมูลกิจกรรมทั้งหมด', 'ตรวจสอบภาพรวมของระบบ', 'ตรวจสอบบันทึกการใช้งานระบบ'];
  [400, 488, 576, 704, 792].forEach((y, i) => uc('a' + i, 1325, y, ADM[i], 300));

  window.drawWires = function () {
    const rc = C.getBoundingClientRect();
    const box = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return { l: r.left - rc.left, r: r.right - rc.left, t: r.top - rc.top, b: r.bottom - rc.top, cx: r.left - rc.left + r.width / 2, cy: r.top - rc.top + r.height / 2 }; };
    const hand = (id, side) => { // where the lines leave a stick figure: the end of its arms
      const f = document.querySelector(`#${id} .fig svg`).getBoundingClientRect();
      return [side === 'right' ? f.right - rc.left : f.left - rc.left, f.top - rc.top + 46];
    };
    const line = { color: '#111', width: 1.4 };
    const fromPoint = (pt, target, o = {}) => {
      // a zero-size marker at the hand so connect() can start from it
      const id = 'p' + Math.round(pt[0]) + '_' + Math.round(pt[1]);
      if (!document.getElementById(id)) C.insertAdjacentHTML('beforeend', `<i id="${id}" style="position:absolute;left:${pt[0]}px;top:${pt[1]}px;width:0;height:0"></i>`);
      connect(id, target, { ...line, from: 'left', ...o });
    };
    const oh = hand('A-org', 'right'), sh = hand('A-stu', 'right'), ah = hand('A-adm', 'left'), th = hand('A-tea', 'right');
    ORG.forEach((_, i) => fromPoint(oh, 'o' + i, { to: 'left' }));
    STU.forEach((_, i) => fromPoint(sh, 's' + i, { to: 'left' }));
    TEA.forEach((_, i) => fromPoint(th, 't' + i, { to: 'left' }));
    // generalization: the teacher is also a participant
    connect(document.querySelector('#A-tea .fig svg'), 'A-stu', { color: '#111', width: 1.4, from: 'top', to: 'bottom', end: 'hollow' });
    ADM.forEach((_, i) => fromPoint(ah, 'a' + i, { to: 'right' }));
    // every role signs in: the organizer's line passes under its last use case, the participant's over its first
    const o5 = box('o5'), s0 = box('s0'), L = box('login');
    fromPoint(oh, 'login', { to: 'left', via: [[o5.l - 20, o5.b + 40]] });
    fromPoint(sh, 'login', { to: 'left', via: [[s0.l - 10, s0.t - 34]] });
    fromPoint(ah, 'login', { to: 'right' });

    const inc = (a, b, o = {}) => connect(a, b, { color: '#111', width: 1.4, dash: '7 5', end: 'open', from: 'right', to: 'left', label: '<<include>>', labelDy: -16, labelColor: '#111', labelBg: 'transparent', ...o });
    inc('o1', 'o-detail');
    inc('o1', 'o-open', { labelDx: 34, labelDy: -24 }); // a sloping line: lift the label clear of it
    inc('s1', 's-detail');
    inc('s4', 's-history');
    inc('t1', 't-result');
  };
</script>
</body>
</html>
